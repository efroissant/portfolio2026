<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projets — Emmanuel Froissant</title>
<meta name="description" content="Les projets d’Emmanuel Froissant, un dossier à la fois.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&amp;family=Instrument+Serif&amp;display=swap" rel="stylesheet">
<script>
  // Intégré dans l’accueil (projets.html?embed) : sans menu ni mentions.
  const PARAMS = new URLSearchParams(location.search);
  if (PARAMS.has('embed')) document.documentElement.classList.add('embed');
  // ?plein : carrousel en plein écran sur l'accueil ; la fiche n'apparaît qu'au défilement.
  if (PARAMS.has('plein')) document.documentElement.classList.add('plein');
  // Plus de carrousel : les dossiers sont posés en rangée, fixes.
  document.documentElement.classList.add('statique');
  // ?decal=2 : la zone déborde de 2 colonnes à gauche (grille de l’accueil) ;
  // la fiche et le dossier actif restent calés sur la zone d’origine.
  window.decalage = () => {
    const n = +PARAMS.get('decal') || 0;
    let PW = innerWidth; try { PW = parent.innerWidth; } catch (e) {}
    if (!n || PW < 1024) return 0;
    const col = Math.max(94, (PW - 48 - 11 * 24) / 12);
    return Math.round(n * (col + 24));
  };
  const majDecal = () => document.documentElement.style.setProperty('--decal', decalage() + 'px');
  majDecal(); addEventListener('resize', majDecal);
</script>
<style>
  :root {
    --fond: #FFFFFF;
    --encre: #1C1917;
    --gris-texte: #666666;
    --filet: rgba(28, 25, 23, .16);
    --serif: "Geist", "Helvetica Neue", Arial, sans-serif;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --l: min(31vw, 96vh);          /* largeur d’un dossier */
  }
  * { box-sizing: border-box; }
  html { scroll-snap-type: y mandatory; }
  html, body { margin: 0; background: var(--fond); color: var(--encre); }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }

  /* La piste : une hauteur d’écran par dossier ; la scène reste collée. */
  .piste > i { display: block; height: 100vh; height: 100svh; scroll-snap-align: start; }
  .scene {
    position: fixed; inset: 0; overflow: hidden;
    perspective: 1800px; perspective-origin: 50% 30%;
  }

  /* ---------- Habillage, façon affiche ---------- */
  .tete {
    position: fixed; top: 16px; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: center; align-items: center; gap: 24px;
    font: 500 12px/16px var(--sans);
  }
  .tete__logo { font: 500 16px/24px var(--serif); letter-spacing: -.02em; }
  .tete nav { display: flex; gap: 16px; }
  .tete nav a { color: var(--gris-texte); }
  .tete nav a[aria-current] { color: var(--encre); }
  .tete nav a:hover { color: var(--encre); }

  .cote {
    position: fixed; top: 50%; z-index: 5; transform: translateY(-50%);
    font: 500 11px/16px var(--sans); color: var(--encre);
  }
  .cote--g { left: 24px; } .cote--d { right: 24px; }

  .fiche {
    position: fixed; top: 16px; left: 24px; z-index: 5; width: 256px;
    transition: opacity .4s;
  }
  .fiche__titre {
    margin: 0 0 8px; font: 500 32px/36px var(--serif); text-transform: uppercase;
    letter-spacing: -.03em;
  }
  .fiche dl { margin: 0; }
  .fiche dl div {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding: 4px 0; border-top: 1px solid var(--filet);
  }
  .fiche dl div:last-child { border-bottom: 1px solid var(--filet); }
  .fiche dt { font: 500 8px/12px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--gris-texte); }
  .fiche dd { margin: 0; font: 500 14px/20px var(--serif); text-align: right; }
  /* Le titre du projet : Instrument Serif, sur une seule ligne. */
  .fiche__titre { font: 400 24px/28px "Instrument Serif", Georgia, serif; letter-spacing: 0; white-space: nowrap; }
  /* Fiche façon A24 : chaque ligne dans un masque, les filets qui se tracent. */
  :is(.fiche, .pied) .masque { display: block; overflow: hidden; }
  :is(.fiche, .pied) .ligne { display: block; will-change: transform; }
  .pied .masque--cta { display: inline-block; padding: 1px; vertical-align: top; }   /* la bordure du bouton reste entière */
  .fiche__titre .masque { width: max-content; padding-bottom: 4px; margin-bottom: -4px; }   /* les jambages restent visibles */
  .fiche dl div { position: relative; border: 0 !important; }
  .fiche__filet { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--filet); transform-origin: 0 50%; }
  .fiche__filet--bas { top: auto; bottom: 0; }

  .pied {
    position: fixed; left: 0; right: 0; bottom: 24px; z-index: 5;
    display: flex; justify-content: center; text-align: center;
    pointer-events: none;
  }
  .pied__bloc { max-width: 400px; transition: opacity .4s; }
  /* La phrase au-dessus du bouton : toujours sur une seule ligne. */
  @media (min-width: 768px) {
    .pied__bloc { max-width: none; }
    .pied__phrase { white-space: nowrap; }
  }
  .pied__bloc.est-change { opacity: 0; }
  .pied__tags { margin: 0 0 8px; font: 500 8px/12px var(--sans); letter-spacing: .14em; text-transform: uppercase; }
  .pied__phrase { margin: 0 0 12px; font: 400 20px/24px var(--serif); letter-spacing: -.01em; }   /* casse de phrase */
  .pied__cta {
    pointer-events: auto; display: inline-block; padding: 8px 16px; border-radius: 999px;
    border: 1px solid var(--encre); font: 500 11px/16px var(--sans);
    transition: background .2s, color .2s;
  }
  /* Au survol, le noir remplit le bouton de gauche à droite, vite et en
     douceur ; il repart vers la droite quand la souris sort. */
  .pied__cta { position: relative; overflow: hidden; isolation: isolate; transition: color .45s cubic-bezier(.22, 1, .36, 1); }
  .pied__cta::before {
    content: ""; position: absolute; inset: 0; z-index: -1; background: var(--encre);
    transform: scaleX(0); transform-origin: 100% 50%;
    transition: transform .45s cubic-bezier(.22, 1, .36, 1);
  }
  .pied__cta:hover, .pied__cta:focus-visible { color: var(--fond); }
  .pied__cta:is(:hover, :focus-visible)::before { transform: scaleX(1); transform-origin: 0 50%; }
  @media (prefers-reduced-motion: reduce) { .pied__cta, .pied__cta::before { transition: none; } }
  .pied__cta[aria-disabled="true"] { opacity: .4; pointer-events: none; }
  .compteur {
    position: fixed; right: 24px; bottom: 24px; z-index: 5;
    font: 400 32px/32px var(--serif); font-variant-numeric: tabular-nums;
  }
  .compteur small { font: 500 11px/16px var(--sans); color: var(--gris-texte); }

  /* ---------- Les dossiers ---------- */
  .dossier {
    position: absolute; left: 50%; top: 50%;
    width: var(--l); height: calc(var(--l) * .84);
    margin: calc(var(--l) * -.42) 0 0 calc(var(--l) * -.5);
    transform-style: preserve-3d; will-change: transform;
    cursor: pointer; outline: none;
  }
  .dossier__pose {               /* l’inclinaison propre au dossier */
    position: absolute; inset: 0; transform-style: preserve-3d;
    /* --rx / --ry : la bascule au survol, selon la position de la souris. */
    transform: rotateX(calc(10deg + var(--rx, 0deg))) rotateY(calc(-10deg + var(--ry, 0deg))) rotateZ(-7deg);
    transition: transform .5s cubic-bezier(.22, 1, .36, 1);
  }
  .dossier__dos, .dossier__face, .dossier__feuille { position: absolute; border-radius: 4px 12px 12px 12px; }
  /* Dossiers blancs, en relief doux (néomorphisme) : lumière en haut à
     gauche, ombre en bas à droite ; la couleur du projet en petite touche. */
  .dossier__dos {
    inset: 0;
    background: linear-gradient(145deg, #F7F6F4, #E4E2DE);
    box-shadow:
      -16px -16px 40px rgba(255, 255, 255, .9),
      24px 32px 64px -8px rgba(28, 25, 23, .22),
      inset 1px 1px 0 rgba(255, 255, 255, .9);
  }
  .dossier__dos::before {
    content: ""; position: absolute; left: 0; top: -24px; width: 38%; height: 32px;
    background: linear-gradient(145deg, #F9F8F6, #EAE8E4); border-radius: 8px 12px 0 0;
    clip-path: polygon(0 0, 82% 0, 100% 100%, 0 100%);
  }
  /* La feuille qui dépasse, avec le visuel du projet. */
  .dossier__feuille {
    left: 4%; right: 4%; top: 4%; bottom: 4%;
    background: #FFFFFF center / cover no-repeat;
    border-radius: 8px; transform: translateZ(2px);
    transition: transform .9s cubic-bezier(.22, 1, .36, 1);
    box-shadow: 0 2px 8px rgba(28, 25, 23, .08);
  }
  .dossier__feuille--vide {
    display: grid; place-items: center;
    font: 400 24px/24px var(--serif); text-transform: uppercase; color: #C9C6C1;
  }
  /* La face avant, articulée en bas : elle s’entrouvre au centre. */
  .dossier__face {
    left: 0; right: 0; bottom: 0; top: 12%;
    background: linear-gradient(150deg, #FCFBFA 0%, #F1F0ED 55%, #E6E4E0 100%);
    transform-origin: 50% 100%; transform: translateZ(4px);
    transition: transform .9s cubic-bezier(.22, 1, .36, 1);
    box-shadow:
      inset 2px 2px 2px rgba(255, 255, 255, 1),
      inset -2px -3px 8px rgba(28, 25, 23, .07),
      0 -8px 24px rgba(28, 25, 23, .06);
    border-radius: 12px 12px 16px 16px;
  }
  /* Le nom du projet, posé sur le carton. */
  .dossier__etiquette { position: absolute; left: 8%; bottom: 10%; right: 8%; }
  .dossier__etiquette b { display: block; font: 400 18px/22px "Instrument Serif", Georgia, serif; letter-spacing: 0; color: var(--encre); }
  .dossier__etiquette span { display: none; }
  .dossier__etiquette { display: none; }   /* noms retirés des dossiers pour le moment */
  /* Le numéro, embossé. */
  .dossier__numero {
    position: absolute; right: 8%; top: 10%;
    font: 300 calc(var(--l) * .12)/1 var(--serif); letter-spacing: -.04em; color: #ECEAE6;
    text-shadow: -1px -1px 1px rgba(255, 255, 255, 1), 1px 2px 2px rgba(28, 25, 23, .14);
  }
  /* Calques propres pour ce qui bouge : la feuille et la face s'animent sans
     faire redessiner le dossier et ses grandes ombres. */
  .dossier__feuille, .dossier__face { will-change: transform; backface-visibility: hidden; }
  .dossier__dos { contain: paint; }
  .dossier.est-actif .dossier__face { transform: translateZ(4px) rotateX(-20deg); }
  .dossier.est-actif .dossier__feuille { transform: translateZ(2px) translateY(-26%); }

  /* Intégré dans l’accueil. */
  .embed, .embed body { background: transparent; }
  .embed .tete, .embed .cote { display: none; }
  .glisse, .glisse body { overflow: hidden; }
  .glisse .piste { display: none; }
  .glisse .scene { touch-action: pan-y; }
  html.glisse:not(.embed) .scene { touch-action: none; }
  .embed .fiche { top: 0; left: var(--decal, 0px); }
  .embed .pied { bottom: 0; }
  .embed .compteur { right: 24px; bottom: 0; }
  .embed { --l: min(calc((100vw - var(--decal, 0px)) * .44), 70vh); }
  /* Le bord gauche s’efface : les dossiers qui partent s’y fondent. */
  .embed .scene { -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%); mask-image: linear-gradient(90deg, transparent, #000 14%); }
  /* Plein écran sur l'accueil : les dossiers sortent par la gauche, la
     fiche prend la place de la photo et du nom au premier défilement. */
  .embed.plein { --l: min(20vw, 60vh); }
  .embed.plein .pied { bottom: 80px; }
  .plein .scene { -webkit-mask-image: none; mask-image: none; }
  .plein .compteur { display: none; }
  .embed.plein .fiche { top: 16px; left: 24px; pointer-events: none; }

  @media (max-width: 767px) {
    :root { --l: 60vw; }
    .fiche { width: auto; right: 16px; left: 16px; top: 48px; }
    .fiche__titre { font-size: 24px; line-height: 28px; }
    .fiche dl { display: none; }
    .tete { top: 12px; }
    .cote { display: none; }
    .pied { bottom: 16px; padding: 0 16px; }
    .pied__phrase { font-size: 16px; line-height: 20px; }
    .compteur { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dossier__face, .dossier__feuille { transition: none; }
  }

  /* Grands écrans (iMac) : fiche en haut à gauche plus lisible. */
  @media (min-width: 1800px) {
    .fiche { width: 360px; }
    .fiche__titre { font: 500 24px/32px var(--serif); letter-spacing: -.01em; }   /* Geist Medium */
    .fiche dl div { padding: 6px 0; }
    .fiche dt { font: 400 16px/24px var(--serif); letter-spacing: 0; text-transform: none; color: var(--gris-texte); }
    .fiche dd { font: 500 18px/24px var(--serif); }
  }
  /* ===== Intro d'un projet ===== */
  .intro {
    position: fixed; inset: 0; z-index: 30; display: none;
    padding: 112px 24px 0; background: var(--fond); color: var(--encre);   /* le titre respire sous la nav */
  }
  .intro.est-la { display: block; }
  .intro .masque { display: block; overflow: hidden; }
  .intro .ligne { display: block; will-change: transform; }
  .intro .fiche__filet { background: rgba(28, 25, 23, .5); }
  .intro__tete { position: relative; text-align: center; }
  .intro__titre { margin: 0 0 16px; font: 400 72px/.95 "Instrument Serif", Georgia, serif; text-transform: uppercase; letter-spacing: -.01em; }
  .intro__titre .masque { padding-bottom: .08em; }
  .intro__trait { position: relative !important; display: block; top: auto !important; }
  .intro__credits { margin: 8px 0 12px; font: 500 14px/20px var(--serif); }
  .intro__credits small { margin-right: 8px; font: 500 8px/12px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--gris-texte); }
  .intro__infos { margin: 0; }
  .intro__infos div { position: relative; display: flex; justify-content: space-between; align-items: baseline; gap: 24px; padding: 6px 0; }
  .intro__infos dt { font: 500 8px/12px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--gris-texte); }
  .intro__infos dd { margin: 0; font: 500 14px/20px var(--serif); text-align: right; max-width: 60%; }
  .intro__croix { position: absolute; top: 56%; font: 300 24px/1 var(--serif); }
  .intro__croix--g { left: 16px; } .intro__croix--d { right: 16px; }
  .intro__bas { position: absolute; left: 0; right: 0; bottom: 24vh; text-align: center; padding: 0 24px; }
  .intro__contexte { max-width: 560px; margin: 0 auto 16px; font: 400 16px/24px var(--serif); }   /* Geist 16 */
  .intro__suite { margin: 0; font: 500 8px/12px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--gris-texte); }
  /* La photo, dessous : seule la forme découpée en bas la laisse voir. */
  .intro__photo { position: fixed; inset: 0; z-index: 31; display: none; pointer-events: none; clip-path: path("M 0 0 Z"); }
  .intro__photo.est-la { display: block; }
  .intro__photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Intro, tailles de la fiche de l'accueil ; contexte remonté sous les infos, en 18. */
  .intro__titre { font: 400 24px/32px "Instrument Serif", Georgia, serif; text-transform: uppercase; letter-spacing: 0; text-align: left; margin: 0 0 12px; }
  .intro__tete { text-align: left; }
  .intro__credits { display: flex; justify-content: space-between; align-items: baseline; margin: 0; padding: 4px 0; font: 500 14px/20px var(--serif); }
  .intro__credits .ligne { display: flex !important; justify-content: space-between; align-items: baseline; width: 100%; }
  .intro__credits small { margin: 0; font: 500 8px/12px var(--sans); letter-spacing: .12em; }
  .intro__infos div { padding: 4px 0; }
  .intro__infos dt { font: 500 8px/12px var(--sans); letter-spacing: .12em; }
  .intro__infos dd { font: 500 14px/20px var(--serif); }
  .intro__croix { display: none; }
  .intro__bas { position: static; text-align: left; padding: 0; margin-top: 48px; }
  .intro__contexte { max-width: 640px; margin: 0 0 16px; font: 400 18px/26px var(--serif); }
  @media (min-width: 1800px) {
    .intro__titre { font: 500 24px/32px var(--serif); letter-spacing: -.01em; }
    .intro__infos dt { font: 400 16px/24px var(--serif); letter-spacing: 0; text-transform: none; }
    .intro__infos dd { font: 500 18px/24px var(--serif); }
    .intro__credits { font: 500 18px/24px var(--serif); }
    .intro__credits small { font: 400 16px/24px var(--serif); letter-spacing: 0; text-transform: none; }
  }
  @media (max-width: 767px) {
    .intro { padding: 88px 16px 0; }
    .intro__titre { font-size: 24px; line-height: 32px; }
    .intro__infos dd { font-size: 13px; line-height: 18px; }
    .intro__contexte { font-size: 16px; line-height: 24px; }
    .intro__bas { bottom: 20vh; padding: 0 16px; }
    .intro__croix { display: none; }
  }

  /* Mode fixe : petits dossiers en rangée ; pas de bloc du bas. */
  html.statique.statique { --l: min(11vw, 176px); }
  .statique .pied, .statique .compteur { display: none !important; }
  .statique:not(.plein) .fiche { display: none; }
  .statique .dossier { transition: none; }
  /* Droits, comme des icônes du dock : plus d'inclinaison ni de bascule. */
  .statique .dossier__pose { transform: none !important; }
  @media (max-width: 767px) { html.statique.statique { --l: 36vw; } }
</style>
</head>
<body>
  <header class="tete">
    <a class="tete__logo" href="index.html" aria-label="Retour au portfolio">E.F</a>
    <nav aria-label="Navigation">
      <a href="projets.html" aria-current="page">Projets</a>
      <a href="index.html#profil">Bio</a>
      <a href="index.html">Bureau</a>
    </nav>
  </header>

  <div class="fiche" aria-live="polite">
    <h1 class="fiche__titre"><span class="masque"><span class="ligne" id="fiche-titre"></span></span></h1>
    <dl>
      <div><i class="fiche__filet"></i><dt><span class="masque"><span class="ligne">Rôle</span></span></dt><dd><span class="masque"><span class="ligne" id="fiche-role"></span></span></dd></div>
      <div><i class="fiche__filet"></i><dt><span class="masque"><span class="ligne">Année</span></span></dt><dd><span class="masque"><span class="ligne" id="fiche-annee"></span></span></dd></div>
      <div><i class="fiche__filet"></i><i class="fiche__filet fiche__filet--bas"></i><dt><span class="masque"><span class="ligne">Secteur</span></span></dt><dd><span class="masque"><span class="ligne" id="fiche-secteur"></span></span></dd></div>
    </dl>
  </div>

  <p class="cote cote--g">Projets</p>
  <p class="cote cote--d">2018–2026</p>

  <main class="scene" id="scene" aria-label="Projets, un dossier à la fois"></main>
  <div class="piste" id="piste" aria-hidden="true"></div>

  <div class="pied">
    <div class="pied__bloc">
      <p class="pied__tags"><span class="masque"><span class="ligne" id="pied-tags"></span></span></p>
      <p class="pied__phrase"><span class="masque"><span class="ligne" id="pied-phrase"></span></span></p>
      <span class="masque masque--cta"><span class="ligne"><a class="pied__cta" id="pied-cta" href="#">Ouvrir le dossier ↗</a></span></span>
    </div>
  </div>
  <p class="compteur" aria-hidden="true"><span id="compteur-n">01</span><small> / <span id="compteur-t">06</span></small></p>

  <!-- Intro d'un projet (clic sur le dossier actif), façon A24 : les lignes se
       tracent depuis la gauche, les infos montent ; en bas, la photo du projet
       perce le fond par une forme qui ondule et suit la souris. Défiler vers
       le bas ouvre l'étude. -->
  <section class="intro" id="intro" aria-hidden="true">
    <div class="intro__tete">
      <h2 class="intro__titre"><span class="masque"><span class="ligne" data-i="titre"></span></span></h2>
      <i class="fiche__filet intro__trait"></i>
      <p class="intro__credits"><span class="masque"><span class="ligne"><small>Rôle</small><span data-i="role"></span></span></span></p>
    </div>
    <dl class="intro__infos">
      <div><i class="fiche__filet"></i><dt><span class="masque"><span class="ligne">Année</span></span></dt><dd><span class="masque"><span class="ligne" data-i="annee"></span></span></dd></div>
      <div><i class="fiche__filet"></i><dt><span class="masque"><span class="ligne">Équipe</span></span></dt><dd><span class="masque"><span class="ligne" data-i="equipe"></span></span></dd></div>
      <div><i class="fiche__filet"></i><dt><span class="masque"><span class="ligne">Logiciels</span></span></dt><dd><span class="masque"><span class="ligne" data-i="logiciels"></span></span></dd></div>
      <div><i class="fiche__filet"></i><i class="fiche__filet fiche__filet--bas"></i><dt><span class="masque"><span class="ligne">Mandat</span></span></dt><dd><span class="masque"><span class="ligne" data-i="mandat"></span></span></dd></div>
    </dl>
    <span class="intro__croix intro__croix--g" aria-hidden="true">+</span><span class="intro__croix intro__croix--d" aria-hidden="true">+</span>
    <div class="intro__bas">
      <p class="intro__contexte"><span class="masque"><span class="ligne" data-i="contexte"></span></span></p>
      <p class="intro__suite"><span class="masque"><span class="ligne">Défiler pour lire l’étude ↓</span></span></p>
    </div>
  </section>
  <div class="intro__photo" id="intro-photo" aria-hidden="true"><img alt="" draggable="false"></div>

<script>
(function carrousel() {

  let souris = null;
  function remplirIntro(p) {
    const v = { titre: p.nom, role: p.intro.role, annee: p.annee, equipe: p.intro.equipe, logiciels: p.intro.logiciels, mandat: p.intro.mandat, contexte: p.intro.contexte };
    INTRO.querySelectorAll('[data-i]').forEach((el) => { el.textContent = v[el.dataset.i] || ''; });
    PHOTO.querySelector('img').src = p.intro.photo;
  }
  function lancerIntro(i) {
    const p = PROJETS[i];
    if (enIntro || !p || !p.intro) { if (p && p.id && !p.intro) ouvrir(p); return; }
    enIntro = true; introProjet = i; lecture = false;
    if (EMBED && parent !== window) parent.postMessage({ type: 'projets-intro', on: true }, '*');
    remplirIntro(p);
    // Les autres dossiers s'effacent ; celui-ci recule très vite au loin.
    dossiers.forEach((d, j) => {
      if (j === i) d.animate([{ transform: d.style.transform, opacity: 1 }, { transform: d.style.transform + ' translateZ(-4200px)', opacity: 0 }], { duration: duree(650), easing: 'cubic-bezier(.6, 0, .9, .3)', fill: 'forwards' });
      else d.animate([{ opacity: 0 }], { duration: duree(260), easing: 'ease-out', fill: 'forwards' });
    });
    sortieDe(FICHE); sortieDe(PIED);
    // Les lignes et les infos, puis la photo.
    setTimeout(() => {
      if (!enIntro) return;
      lignesDe(INTRO).forEach((l) => l.animate([{ transform: 'translateY(120%)' }], { duration: 1, fill: 'forwards' }));
      filetsDe(INTRO).forEach((f) => f.animate([{ transform: 'scaleX(0)' }], { duration: 1, fill: 'forwards' }));
      INTRO.classList.add('est-la'); INTRO.setAttribute('aria-hidden', 'false');
      filetsDe(INTRO).forEach((f, k) => { f.style.transformOrigin = '0 50%'; f.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: duree(1000), delay: duree(k * 90), easing: 'cubic-bezier(.65, 0, .35, 1)', fill: 'both' }); });
      lignesDe(INTRO).forEach((l, k) => l.animate([{ transform: 'translateY(120%)' }, { transform: 'translateY(0)' }], { duration: duree(800), delay: duree(260 + k * 55), easing: ENTREE, fill: 'both' }));
      avance = 0;   // plus de photo ni de bord ondulé
      if (!bouclePhoto) bouclePhoto = requestAnimationFrame(animerPhoto);
    }, calme ? 0 : 560);
  }
  function fermerIntro() {
    if (!enIntro) return;
    enIntro = false; lecture = false;
    if (EMBED && parent !== window) parent.postMessage({ type: 'projets-intro', on: false }, '*');
    INTRO.classList.remove('est-la'); INTRO.setAttribute('aria-hidden', 'true');
    [INTRO, PHOTO].forEach((el) => el.getAnimations().forEach((a) => a.cancel()));
    PHOTO.classList.remove('est-la'); peek = peekCible = 0;
    cancelAnimationFrame(bouclePhoto); bouclePhoto = 0;
    dossiers.forEach((d) => d.getAnimations().forEach((a) => a.cancel()));
    poser();
    if (STATIQUE) {
      // Retour à l'accueil : pas de fiche derrière, tous les dossiers fermés,
      // ma photo revient (l'accueil la fait remonter).
      survolOn = false; ++tour; clearTimeout(tSurvol);
      cacherFiche();
      dossiers.forEach((d) => d.classList.remove('est-actif'));
      dossiers.forEach((_, i) => { vagueCible[i] = 0; vague[i] = 0; });
      poser();
      if (EMBED && parent !== window) parent.postMessage({ type: 'projets-defile', on: false }, '*');
      return;
    }
    if (ficheVisible()) entreeFiche();
    entreeDe(PIED, 90);
  }
  // Défiler vers le bas : la forme s'ouvre sur toute la photo, puis l'étude.
  function lireEtude() {
    if (lecture) return;
    lecture = true;
    const p = PROJETS[introProjet];
    // Plus de photo plein écran : l'intro s'efface et l'étude, centrée, apparaît.
    // L'intro part vers la gauche ; les cartes de l'étude arrivent de la droite.
    INTRO.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(-30vw)' }], { duration: duree(560), easing: 'cubic-bezier(.7, 0, .84, 0)', fill: 'forwards' });
    if (EMBED && parent !== window) parent.postMessage({ type: 'projets-entree-droite', id: p.id }, '*');
    setTimeout(() => {
      if (!enIntro) return;
      if (EMBED && parent !== window) ouvrir(p); else location.href = lien(p);
    }, calme ? 0 : 260);
  }
  // Défiler vers le bas fait monter la photo peu à peu, en parallaxe derrière
  // son bord ondulé ; une fois entièrement révélée, l'étude s'ouvre.
  let avance = 0, cumulIntro = 0, finIntro = 0;
  const BASE = () => (innerWidth < 768 ? .12 : .17);
  function majAvance(v) {
    avance = Math.max(0, Math.min(1, v));
    if (avance >= .12) lireEtude();   // un geste vers le bas suffit
  }
  function molletteIntro(d) {
    if (lecture) return;
    if (avance <= 0 && d < 0) {                       // tout en haut et on remonte : retour aux dossiers
      cumulIntro += d; clearTimeout(finIntro); finIntro = setTimeout(() => { cumulIntro = 0; }, 200);
      if (cumulIntro < -160) fermerIntro();
      return;
    }
    majAvance(avance + d / 900);
  }
  addEventListener('keydown', (e) => {
    if (!enIntro) return;
    if (/^Arrow| |Enter|Escape/.test(e.key)) e.stopPropagation();   // les flèches ne bougent plus les dossiers
    if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); majAvance(avance + .34); }
    if (e.key === 'Enter') { e.preventDefault(); lireEtude(); }
    if (e.key === 'ArrowUp') { if (avance > 0) majAvance(avance - .34); else fermerIntro(); }
    if (e.key === 'Escape') fermerIntro();
  }, true);
  let yIntro = null;
  INTRO.addEventListener('pointerdown', (e) => { yIntro = e.clientY; });
  INTRO.addEventListener('pointerup', (e) => { if (yIntro !== null && Math.abs(yIntro - e.clientY) > 40) majAvance(avance + (yIntro - e.clientY) / innerHeight * 1.6); yIntro = null; });
  addEventListener('pointermove', (e) => { souris = { x: e.clientX, y: e.clientY }; }, { passive: true });
  addEventListener('pointerleave', () => { souris = null; });
  // La forme : un bord haut qui ondule (bruit lent), plus haut au centre,
  // qui se soulève vers la souris quand elle approche.
  let mx = .5, my = 0;
  function animerPhoto(now) {
    tIntro = now / 1000;
    peek += (peekCible - peek) * (lecture ? .07 : .06);
    const W = innerWidth, H = innerHeight;
    const cx = W * (.5 + Math.sin(tIntro * .25) * .025);
    const portee = W * (W < 768 ? .55 : .36);
    // La souris attire la forme (adouci).
    const sx = souris ? souris.x / W : .5, sy = souris ? souris.y / H : 0;
    mx += (sx - mx) * .06; my += (sy - my) * .06;
    const attire = Math.max(0, Math.min(1, (my - .45) / .45));
    let d = 'M -40 ' + (H + 40) + ' ';
    const pas = 24, pts = [];
    for (let x = -40; x <= W + 40; x += pas) {
      const g = Math.exp(-Math.pow((x - cx) / portee, 2) * 1.3);
      const bruit = .92 + .05 * Math.sin(x * .009 + tIntro * .7) + .03 * Math.sin(x * .023 - tIntro * .5) + .015 * Math.sin(x * .05 + tIntro * 1.1);   // ondulation légère
      const versSouris = Math.exp(-Math.pow((x - mx * W) / (W * .13), 2)) * attire * H * .04;
      const h = peek >= 1.2 ? H * peek : peek * H * g * bruit + versSouris * Math.min(1, peek * 6);
      pts.push([x, H - h]);
    }
    d += 'L ' + pts[0][0] + ' ' + pts[0][1].toFixed(1) + ' ';
    for (let k = 1; k < pts.length - 1; k++) {
      const xm = (pts[k][0] + pts[k + 1][0]) / 2, ym = (pts[k][1] + pts[k + 1][1]) / 2;
      d += 'Q ' + pts[k][0] + ' ' + pts[k][1].toFixed(1) + ' ' + xm.toFixed(1) + ' ' + ym.toFixed(1) + ' ';
    }
    d += 'L ' + (W + 40) + ' ' + (H + 40) + ' Z';
    PHOTO.style.clipPath = 'path("' + d + '")';
    // Parallaxe : la photo monte moins vite que son bord.
    const montee = Math.min(1, Math.max(0, (peek - BASE()) / (.55 - BASE())));
    PHOTO.firstElementChild.style.transform = 'translate3d(0,' + ((1 - montee) * 14).toFixed(2) + '%,0) scale(1.08)';
    bouclePhoto = enIntro ? requestAnimationFrame(animerPhoto) : 0;
  }
  // Mode fixe : au survol d'un dossier, il s'entrouvre et la fiche du projet
  // entre en haut à gauche (à la place de ma photo) ; elle sort quand on quitte.
  function survol(i) {
    if (!STATIQUE || enIntro) return;
    clearTimeout(tSurvol);
    if (!survolOn) { survolOn = true; if (EMBED && parent !== window) parent.postMessage({ type: 'projets-defile', on: true }, '*'); }
    if (!ficheOuverte) {
      actif = i; montre = -1; const t = ++tour;
      dossiers.forEach((d, j) => d.classList.toggle('est-actif', j === i));
      if (EMBED && parent !== window) parent.postMessage({ type: 'projets-actif', i }, '*');
      remplir(i);
      // La fiche attend que ma photo soit sortie (pas de superposition).
      cacherFiche();
      setTimeout(() => { if (survolOn && t === tour && !ficheOuverte) entreeFiche(); }, calme ? 0 : 240);
    } else if (actif !== i) fiche(i);
  }
  function finSurvol() {
    if (!STATIQUE) return;
    clearTimeout(tSurvol);
    tSurvol = setTimeout(() => {
      if (enIntro) return;
      survolOn = false; const t = ++tour;
      dossiers.forEach((d) => d.classList.remove('est-actif'));
      // La fiche sort d'abord ; ma photo revient ensuite, depuis le bas.
      const rendre = () => { if (!survolOn && t === tour && EMBED && parent !== window) parent.postMessage({ type: 'projets-defile', on: false }, '*'); };
      if (ficheOuverte) sortieFiche().then(rendre); else rendre();
    }, 220);
  }
  dossiers.forEach((d, i) => { d.addEventListener('pointerenter', (e) => { if (e.pointerType !== 'touch') survol(i); }); d.addEventListener('pointerleave', finSurvol); });
  lire(); courant = cible; poser(); fiche(indexCible());
  if (STATIQUE) dossiers.forEach((d) => d.classList.remove('est-actif'));   // tous fermés au départ
  // Intégré : la liste pour le menu Index de l'accueil, et ses ordres.
  if (EMBED && parent !== window) {
    const envoyerListe = () => parent.postMessage({ type: 'projets-liste', actif, liste: PROJETS.map((p) => ({ nom: p.nom, annee: p.annee, id: p.id || null })) }, '*');
    envoyerListe();
    addEventListener('message', (e) => {
      if (e.source !== parent) return;
      const d = e.data || {};
      if (d.type === 'projets-demande') { envoyerListe(); defile = null; majDefile(); }
      if (d.type === 'projets-aller' && Number.isInteger(d.i)) { if (STATIQUE) { const q = PROJETS[d.i]; if (q && q.id) lancerIntro(d.i); } else allerVers(d.i); }
      // Retour au tout début : on recale le compteur sur le tour le plus
      // proche (invisible, la boucle est identique), puis on revient au 1.
      if (d.type === 'projets-retour') fermerIntro();
      if (d.type === 'projets-debut') { fermerIntro(); const m = N * Math.floor((cible + N / 2 - .001) / N); cible -= m; courant -= m; aller(0); }
    });
  }
  relancer();
  // Les visuels des feuilles sont décodés d'avance : pas d'à-coup quand un
  // dossier s'ouvre pour la première fois.
  PROJETS.forEach((p) => { if (!p.img) return; const im = new Image(); im.src = p.img; if (im.decode) im.decode().catch(() => {}); });
})();
</script>
