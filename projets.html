<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projets — Emmanuel Froissant</title>
<meta name="description" content="Les projets d’Emmanuel Froissant, un dossier à la fois.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&amp;family=Instrument+Serif&amp;display=swap" rel="stylesheet">
<script>
  // Intégré dans l’accueil (projets.html?embed) : sans menu ni mentions.
  const PARAMS = new URLSearchParams(location.search);
  if (PARAMS.has('embed')) document.documentElement.classList.add('embed');
  // ?plein : carrousel en plein écran sur l'accueil ; la fiche n'apparaît qu'au défilement.
  if (PARAMS.has('plein')) document.documentElement.classList.add('plein');
  // ?decal=2 : la zone déborde de 2 colonnes à gauche (grille de l’accueil) ;
  // la fiche et le dossier actif restent calés sur la zone d’origine.
  window.decalage = () => {
    const n = +PARAMS.get('decal') || 0;
    let PW = innerWidth; try { PW = parent.innerWidth; } catch (e) {}
    if (!n || PW < 1024) return 0;
    const col = Math.max(94, (PW - 48 - 11 * 24) / 12);
    return Math.round(n * (col + 24));
  };
  const majDecal = () => document.documentElement.style.setProperty('--decal', decalage() + 'px');
  majDecal(); addEventListener('resize', majDecal);
</script>
<style>
  :root {
    --fond: #F0F0F0;
    --encre: #1C1917;
    --gris-texte: #666666;
    --filet: rgba(28, 25, 23, .16);
    --serif: "Geist", "Helvetica Neue", Arial, sans-serif;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --l: min(31vw, 96vh);          /* largeur d’un dossier */
  }
  * { box-sizing: border-box; }
  html { scroll-snap-type: y mandatory; }
  html, body { margin: 0; background: var(--fond); color: var(--encre); }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }

  /* La piste : une hauteur d’écran par dossier ; la scène reste collée. */
  .piste > i { display: block; height: 100vh; height: 100svh; scroll-snap-align: start; }
  .scene {
    position: fixed; inset: 0; overflow: hidden;
    perspective: 1800px; perspective-origin: 50% 30%;
  }

  /* ---------- Habillage, façon affiche ---------- */
  .tete {
    position: fixed; top: 16px; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: center; align-items: center; gap: 24px;
    font: 500 12px/16px var(--sans);
  }
  .tete__logo { font: 500 16px/24px var(--serif); letter-spacing: -.02em; }
  .tete nav { display: flex; gap: 16px; }
  .tete nav a { color: var(--gris-texte); }
  .tete nav a[aria-current] { color: var(--encre); }
  .tete nav a:hover { color: var(--encre); }

  .cote {
    position: fixed; top: 50%; z-index: 5; transform: translateY(-50%);
    font: 500 11px/16px var(--sans); color: var(--encre);
  }
  .cote--g { left: 24px; } .cote--d { right: 24px; }

  .fiche {
    position: fixed; top: 16px; left: 24px; z-index: 5; width: 256px;
    transition: opacity .4s;
  }
  .fiche__titre {
    margin: 0 0 8px; font: 500 32px/36px var(--serif); text-transform: uppercase;
    letter-spacing: -.03em;
  }
  .fiche dl { margin: 0; }
  .fiche dl div {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 4px 0; border-top: 1px solid var(--filet);
  }
  .fiche dl div:last-child { border-bottom: 1px solid var(--filet); }
  .fiche dt { font: 500 8px/12px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--gris-texte); }
  .fiche dd { margin: 0; font: 500 11px/12px var(--sans); text-align: right; }
  /* Le titre du projet : Instrument Serif, sur une seule ligne. */
  .fiche__titre { font: 400 40px/40px "Instrument Serif", Georgia, serif; letter-spacing: -.01em; white-space: nowrap; }
  /* Fiche façon A24 : chaque ligne dans un masque, les filets qui se tracent. */
  .fiche .masque { display: block; overflow: hidden; }
  .fiche .ligne { display: block; will-change: transform; }
  .fiche__titre .masque { width: max-content; padding-bottom: 4px; margin-bottom: -4px; }   /* les jambages restent visibles */
  .fiche dl div { position: relative; border: 0 !important; }
  .fiche__filet { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--filet); transform-origin: 0 50%; }
  .fiche__filet--bas { top: auto; bottom: 0; }

  .pied {
    position: fixed; left: 0; right: 0; bottom: 24px; z-index: 5;
    display: flex; justify-content: center; text-align: center;
    pointer-events: none;
  }
  .pied__bloc { max-width: 400px; transition: opacity .4s; }
  .pied__bloc.est-change { opacity: 0; }
  .pied__tags { margin: 0 0 8px; font: 500 8px/12px var(--sans); letter-spacing: .14em; text-transform: uppercase; }
  .pied__phrase { margin: 0 0 12px; font: 400 20px/24px var(--serif); text-transform: uppercase; letter-spacing: -.01em; }
  .pied__cta {
    pointer-events: auto; display: inline-block; padding: 8px 16px; border-radius: 999px;
    border: 1px solid var(--encre); font: 500 11px/16px var(--sans);
    transition: background .2s, color .2s;
  }
  .pied__cta:hover { background: var(--encre); color: var(--fond); }
  .pied__cta[aria-disabled="true"] { opacity: .4; pointer-events: none; }
  .compteur {
    position: fixed; right: 24px; bottom: 24px; z-index: 5;
    font: 400 32px/32px var(--serif); font-variant-numeric: tabular-nums;
  }
  .compteur small { font: 500 11px/16px var(--sans); color: var(--gris-texte); }

  /* ---------- Les dossiers ---------- */
  .dossier {
    position: absolute; left: 50%; top: 50%;
    width: var(--l); height: calc(var(--l) * .84);
    margin: calc(var(--l) * -.42) 0 0 calc(var(--l) * -.5);
    transform-style: preserve-3d; will-change: transform, filter;
    cursor: pointer; outline: none;
  }
  .dossier__pose {               /* l’inclinaison propre au dossier */
    position: absolute; inset: 0; transform-style: preserve-3d;
    /* --rx / --ry : la bascule au survol, selon la position de la souris. */
    transform: rotateX(calc(10deg + var(--rx, 0deg))) rotateY(calc(-10deg + var(--ry, 0deg))) rotateZ(-7deg);
    transition: transform .5s cubic-bezier(.22, 1, .36, 1);
  }
  .dossier__dos, .dossier__face, .dossier__feuille { position: absolute; border-radius: 4px 12px 12px 12px; }
  /* Dossiers blancs, en relief doux (néomorphisme) : lumière en haut à
     gauche, ombre en bas à droite ; la couleur du projet en petite touche. */
  .dossier__dos {
    inset: 0;
    background: linear-gradient(145deg, #F7F6F4, #E4E2DE);
    box-shadow:
      -16px -16px 40px rgba(255, 255, 255, .9),
      24px 32px 64px -8px rgba(28, 25, 23, .22),
      inset 1px 1px 0 rgba(255, 255, 255, .9);
  }
  .dossier__dos::before {
    content: ""; position: absolute; left: 0; top: -24px; width: 38%; height: 32px;
    background: linear-gradient(145deg, #F9F8F6, #EAE8E4); border-radius: 8px 12px 0 0;
    clip-path: polygon(0 0, 82% 0, 100% 100%, 0 100%);
  }
  /* La feuille qui dépasse, avec le visuel du projet. */
  .dossier__feuille {
    left: 4%; right: 4%; top: 4%; bottom: 4%;
    background: #FFFFFF center / cover no-repeat;
    border-radius: 8px; transform: translateZ(2px);
    transition: transform .9s cubic-bezier(.22, 1, .36, 1);
    box-shadow: 0 2px 8px rgba(28, 25, 23, .08);
  }
  .dossier__feuille--vide {
    display: grid; place-items: center;
    font: 400 24px/24px var(--serif); text-transform: uppercase; color: #C9C6C1;
  }
  /* La face avant, articulée en bas : elle s’entrouvre au centre. */
  .dossier__face {
    left: 0; right: 0; bottom: 0; top: 12%;
    background: linear-gradient(150deg, #FCFBFA 0%, #F1F0ED 55%, #E6E4E0 100%);
    transform-origin: 50% 100%; transform: translateZ(4px);
    transition: transform .9s cubic-bezier(.22, 1, .36, 1);
    box-shadow:
      inset 2px 2px 2px rgba(255, 255, 255, 1),
      inset -2px -3px 8px rgba(28, 25, 23, .07),
      0 -8px 24px rgba(28, 25, 23, .06);
    border-radius: 12px 12px 16px 16px;
  }
  /* Le nom du projet, posé sur le carton. */
  .dossier__etiquette { position: absolute; left: 8%; bottom: 10%; right: 8%; }
  .dossier__etiquette b { display: block; font: 400 calc(var(--l) * .056)/1.1 var(--serif); letter-spacing: -.01em; color: var(--encre); }
  .dossier__etiquette span { display: none; }
  /* Le numéro, embossé. */
  .dossier__numero {
    position: absolute; right: 8%; top: 10%;
    font: 300 calc(var(--l) * .12)/1 var(--serif); letter-spacing: -.04em; color: #ECEAE6;
    text-shadow: -1px -1px 1px rgba(255, 255, 255, 1), 1px 2px 2px rgba(28, 25, 23, .14);
  }
  .dossier.est-actif .dossier__face { transform: translateZ(4px) rotateX(-20deg); }
  .dossier.est-actif .dossier__feuille { transform: translateZ(2px) translateY(-26%); }

  /* Intégré dans l’accueil. */
  .embed, .embed body { background: transparent; }
  .embed .tete, .embed .cote { display: none; }
  .glisse, .glisse body { overflow: hidden; }
  .glisse .piste { display: none; }
  .glisse .scene { touch-action: pan-y; }
  html.glisse:not(.embed) .scene { touch-action: none; }
  .embed .fiche { top: 0; left: var(--decal, 0px); }
  .embed .pied { bottom: 0; }
  .embed .compteur { right: 24px; bottom: 0; }
  .embed { --l: min(calc((100vw - var(--decal, 0px)) * .44), 70vh); }
  /* Le bord gauche s’efface : les dossiers qui partent s’y fondent. */
  .embed .scene { -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%); mask-image: linear-gradient(90deg, transparent, #000 14%); }
  /* Plein écran sur l'accueil : les dossiers sortent par la gauche, la
     fiche prend la place de la photo et du nom au premier défilement. */
  .embed.plein { --l: min(20vw, 60vh); }
  .embed.plein .pied { bottom: 80px; }
  .plein .scene { -webkit-mask-image: none; mask-image: none; }
  .plein .compteur { display: none; }
  .embed.plein .fiche { top: 16px; left: 24px; pointer-events: none; }

  @media (max-width: 767px) {
    :root { --l: 60vw; }
    .fiche { width: auto; right: 16px; left: 16px; top: 48px; }
    .fiche__titre { font-size: 24px; line-height: 28px; }
    .fiche dl { display: none; }
    .tete { top: 12px; }
    .cote { display: none; }
    .pied { bottom: 16px; padding: 0 16px; }
    .pied__phrase { font-size: 16px; line-height: 20px; }
    .compteur { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dossier__face, .dossier__feuille { transition: none; }
  }
</style>
</head>
<body>
  <header class="tete">
    <a class="tete__logo" href="index.html" aria-label="Retour au portfolio">E.F</a>
    <nav aria-label="Navigation">
      <a href="projets.html" aria-current="page">Projets</a>
      <a href="index.html#profil">Bio</a>
      <a href="index.html">Bureau</a>
    </nav>
  </header>

  <div class="fiche" aria-live="polite">
    <h1 class="fiche__titre"><span class="masque"><span class="ligne" id="fiche-titre"></span></span></h1>
    <dl>
      <div><i class="fiche__filet"></i><dt><span class="masque"><span class="ligne">Rôle</span></span></dt><dd><span class="masque"><span class="ligne" id="fiche-role"></span></span></dd></div>
      <div><i class="fiche__filet"></i><dt><span class="masque"><span class="ligne">Année</span></span></dt><dd><span class="masque"><span class="ligne" id="fiche-annee"></span></span></dd></div>
      <div><i class="fiche__filet"></i><i class="fiche__filet fiche__filet--bas"></i><dt><span class="masque"><span class="ligne">Secteur</span></span></dt><dd><span class="masque"><span class="ligne" id="fiche-secteur"></span></span></dd></div>
    </dl>
  </div>

  <p class="cote cote--g">Projets</p>
  <p class="cote cote--d">2018–2026</p>

  <main class="scene" id="scene" aria-label="Projets, un dossier à la fois"></main>
  <div class="piste" id="piste" aria-hidden="true"></div>

  <div class="pied">
    <div class="pied__bloc">
      <p class="pied__tags" id="pied-tags"></p>
      <p class="pied__phrase" id="pied-phrase"></p>
      <a class="pied__cta" id="pied-cta" href="#">Ouvrir le dossier ↗</a>
    </div>
  </div>
  <p class="compteur" aria-hidden="true"><span id="compteur-n">01</span><small> / <span id="compteur-t">06</span></small></p>

<script>
(function carrousel() {
  const PROJETS = [
    { nom: 'Pharmaprix', id: 'loblaw', c: '#F05454', img: 'lob-pharmacienne.webp',
      role: 'UX/UI, recherche', annee: '2021–23', secteur: 'Pharmacie',
      tags: 'Design UX/UI · Recherche · Logiciel métier', phrase: 'Treize ans d’habitudes à redessiner.' },
    { nom: 'Groupe Voyage Québec', id: 'gvq', c: '#F5C044', img: 'gvq-agenda-920.webp',
      role: 'UX/UI', annee: '2024', secteur: 'Voyage',
      tags: 'Design UX/UI · MVP · Parcours participant', phrase: 'Un MVP qui devait vendre avant d’exister.' },
    { nom: 'Roche Diabetes Care', id: 'roche', c: '#5AA2F0', img: 'roche-strategy-1064.webp',
      role: 'D.A, UX/UI', annee: '2018', secteur: 'Santé',
      tags: 'Direction artistique · UX/UI · Campagne', phrase: 'Un selfie retourné, cinq dollars pour la recherche.' },
    { nom: 'Aéroplan', c: '#A98BF5', role: 'Web design', annee: 'Bientôt', secteur: 'Fidélité',
      tags: 'Web design', phrase: 'Étude à venir.' },
    { nom: 'Budge Studios', c: '#F07FB7', role: 'Web design', annee: 'Bientôt', secteur: 'Jeux',
      tags: 'Web design', phrase: 'Étude à venir.' },
    { nom: 'Clinique Beaconsfield', c: '#29D177', role: 'Web design', annee: '2026', secteur: 'Santé',
      tags: 'Web design', phrase: 'Étude à venir.' }
  ];
  const scene = document.getElementById('scene'), piste = document.getElementById('piste');
  const calme = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const N = PROJETS.length;
  const fonce = (hex, k) => '#' + [1, 3, 5].map((i) => Math.round(parseInt(hex.substr(i, 2), 16) * k).toString(16).padStart(2, '0')).join('');
  const lien = (p) => p.id ? 'index.html#case/' + p.id : null;
  const EMBED = document.documentElement.classList.contains('embed');
  // Intégré : l’étude s’ouvre dans le site, sans recharger la page.
  function ouvrir(p) {
    try { parent.history.pushState(null, '', '#case/' + p.id); parent.dispatchEvent(new PopStateEvent('popstate')); }
    catch (e) { top.location.href = lien(p); }
  }
  document.getElementById('pied-cta').addEventListener('click', (e) => {
    const p = PROJETS[actif];
    if (EMBED && p && p.id) { e.preventDefault(); ouvrir(p); }
  });

  const dossiers = PROJETS.map((p, i) => {
    piste.append(document.createElement('i'));
    const d = document.createElement('a');
    d.className = 'dossier';
    d.style.setProperty('--c', p.c);
    d.style.setProperty('--c-fonce', fonce(p.c, .8));
    if (lien(p)) d.href = lien(p);
    d.setAttribute('aria-label', p.nom + (p.id ? ', ouvrir l’étude' : ', étude à venir'));
    const feuille = p.img
      ? '<div class="dossier__feuille" style="background-image:url(\'' + p.img + '\')"></div>'
      : '<div class="dossier__feuille dossier__feuille--vide">Bientôt</div>';
    d.innerHTML = '<div class="dossier__pose"><div class="dossier__dos"></div>' + feuille +
      '<div class="dossier__face"><span class="dossier__numero">' + String(i + 1).padStart(2, '0') + '</span>' +
      '<span class="dossier__etiquette"><b></b><span></span></span></div></div>';
    d.querySelector('b').textContent = p.nom;
    d.querySelector('.dossier__etiquette span').textContent = p.secteur + ' · ' + p.annee;
    d.addEventListener('click', (e) => {
      // Un dossier qui n’est pas au centre y vient d’abord.
      if (Math.round(cible) !== i || !p.id) { e.preventDefault(); aller(i); }
      else if (EMBED) { e.preventDefault(); ouvrir(p); }
    });
    // Au survol, le dossier pivote vers la souris (jusqu’à 20° de chaque côté).
    const pose = d.querySelector('.dossier__pose');
    d.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'touch' || calme) return;
      const r = d.getBoundingClientRect();
      const u = (e.clientX - r.left) / r.width - .5, v = (e.clientY - r.top) / r.height - .5;
      pose.style.setProperty('--ry', (u * 40).toFixed(2) + 'deg');
      pose.style.setProperty('--rx', (-v * 36).toFixed(2) + 'deg');
    });
    d.addEventListener('pointerleave', () => { pose.style.removeProperty('--rx'); pose.style.removeProperty('--ry'); });
    scene.append(d);
    return d;
  });
  document.getElementById('compteur-t').textContent = String(N).padStart(2, '0');

  // Le parcours, relevé sur la référence (centre et taille de chaque élément,
  // en fraction de l’écran) : une courbe qui grimpe fort vers la droite et
  // s’aplatit vers la gauche, où les dossiers rapetissent et se resserrent.
  //            k :   -4     -3     -2     -1      0      1      2
  const COURBE = {
    bureau: { x: [-.25,  .00,  .14,  .30,  .517,  .80,  1.13],   // dossiers resserrés
              y: [ .72,  .69,  .67,  .63,  .507,  .30,   .06],
              s: [ .46,  .56,  .67,  .80,  1,     1.4,  1.85] },   // à droite, plus proches : plus grands
    mobile: { x: [-1.35, -.95, -.55, -.10,  .50,  1.12,  1.7],
              y: [ .72,  .70,  .67,  .63,   .50,   .27,  .02],
              s: [ .46,  .56,  .67,  .80,   1,     1.07, 1.12] }
  };
  // Interpolation douce (Catmull-Rom) entre les points relevés.
  function suivre(t, k) {
    const f = Math.min(t.length - 1.001, Math.max(0, k + 4)), j = Math.floor(f), u = f - j;
    const p0 = t[Math.max(0, j - 1)], p1 = t[j], p2 = t[j + 1], p3 = t[Math.min(t.length - 1, j + 2)];
    return .5 * (2 * p1 + (p2 - p0) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u * u + (3 * p1 - p0 - 3 * p2 + p3) * u * u * u);
  }
  let cible = 0, courant = 0, actif = -1;
  // Pas de défilement natif : un geste (molette, trackpad, glisser, flèches)
  // fait avancer ou reculer d'un dossier. Intégré sur téléphone, la page
  // autour continue de défiler à la verticale.
  const glisse = () => true;
  const telIntegre = () => EMBED && innerWidth < 1024;
  function lire() { if (glisse()) return; const v = scrollY / Math.max(1, innerHeight); cible = Math.min(N - 1, Math.max(0, v || 0)); }
  function poser() {
    const W = innerWidth, H = innerHeight, c = W < 768 ? COURBE.mobile : COURBE.bureau;
    const D = window.decalage ? decalage() : 0, Z = W - D;   // la zone d’origine, sans le débord
    dossiers.forEach((d, i) => {
      const k = i - courant, a = Math.abs(k);
      const x = D + suivre(c.x, k) * Z - W / 2, y = (suivre(c.y, k) - .5) * H, sc = suivre(c.s, k);
      d.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scale(' + sc.toFixed(4) + ') rotateZ(' + (-k * 2).toFixed(2) + 'deg)';
      d.style.filter = k > -.05 ? 'none' : 'brightness(' + (1 - Math.min(.1, a * .035)).toFixed(3) + ')';
      d.style.opacity = (k > 2.2 || k < -4.2) ? 0 : 1;
      // Devant : l’actif, puis le suivant ; les précédents passent dessous.
      d.style.zIndex = String(Math.round(100 - (k < 0 ? a * 20 : a * 10)));
      d.tabIndex = Math.round(cible) === i ? 0 : -1;
    });
  }
  // La fiche s'anime comme sur A24 : les lignes sortent vers le haut et les
  // filets se rétractent vers la droite ; puis le nouveau texte monte depuis
  // le bas de son masque et les filets se retracent depuis la gauche.
  const FICHE = document.querySelector('.fiche');
  const lignes = () => [...FICHE.querySelectorAll('.ligne')];
  const filets = () => [...FICHE.querySelectorAll('.fiche__filet')];
  const ENTREE = 'cubic-bezier(.16, 1, .3, 1)', SORTIE = 'cubic-bezier(.7, 0, .84, 0)';
  const duree = (ms) => (calme ? 1 : ms);
  const figer = (el) => el.getAnimations().forEach((a) => { try { a.commitStyles(); } catch (e) {} a.cancel(); });
  function sortieFiche() {
    const anims = [];
    lignes().forEach((l, k) => { figer(l); anims.push(l.animate([{ transform: getComputedStyle(l).transform === 'none' ? 'translateY(0)' : getComputedStyle(l).transform }, { transform: 'translateY(-120%)' }], { duration: duree(380), delay: duree(k * 20), easing: SORTIE, fill: 'forwards' })); });
    filets().forEach((f, k) => { figer(f); f.style.transformOrigin = '100% 50%'; anims.push(f.animate([{ transform: getComputedStyle(f).transform === 'none' ? 'scaleX(1)' : getComputedStyle(f).transform }, { transform: 'scaleX(0)' }], { duration: duree(380), delay: duree(k * 30), easing: SORTIE, fill: 'forwards' })); });
    return Promise.all(anims.map((a) => a.finished.catch(() => {})));
  }
  function entreeFiche() {
    lignes().forEach((l, k) => { figer(l); l.animate([{ transform: 'translateY(120%)' }, { transform: 'translateY(0)' }], { duration: duree(900), delay: duree(k * 45), easing: ENTREE, fill: 'both' }); });
    filets().forEach((f, k) => { figer(f); f.style.transformOrigin = '0 50%'; f.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: duree(900), delay: duree(80 + k * 70), easing: ENTREE, fill: 'both' }); });
  }
  function cacherFiche() {
    lignes().forEach((l) => { figer(l); l.style.transform = 'translateY(120%)'; });
    filets().forEach((f) => { figer(f); f.style.transform = 'scaleX(0)'; });
  }
  const PLEIN = document.documentElement.classList.contains('plein');
  const ficheVisible = () => !PLEIN || defile;
  let tour = 0, montre = -1;   // montre : le projet affiché dans la fiche
  function remplir(j) {
    const p = PROJETS[j]; montre = j;
    document.getElementById('fiche-titre').textContent = p.nom;
    document.getElementById('fiche-role').textContent = p.role;
    document.getElementById('fiche-annee').textContent = p.annee;
    document.getElementById('fiche-secteur').textContent = p.secteur;
  }
  function fiche(i) {
    if (i === actif) return;
    const premier = actif < 0;
    actif = i;
    if (EMBED && parent !== window) parent.postMessage({ type: 'projets-actif', i }, '*');
    dossiers.forEach((d, j) => d.classList.toggle('est-actif', j === i));
    const p = PROJETS[i], t = ++tour;
    // La fiche du haut.
    if (premier) { remplir(i); if (ficheVisible()) entreeFiche(); else cacherFiche(); }
    else if (!ficheVisible()) remplir(i);
    else if (montre !== i) sortieFiche().then(() => { if (t !== tour) return; remplir(actif); entreeFiche(); });
    // Le bloc du bas, en fondu.
    const bloc = document.querySelector('.pied__bloc');
    bloc.classList.add('est-change');
    setTimeout(() => {
      document.getElementById('pied-tags').textContent = p.tags;
      document.getElementById('pied-phrase').textContent = p.phrase;
      const cta = document.getElementById('pied-cta');
      if (p.id) { cta.href = lien(p); cta.removeAttribute('aria-disabled'); cta.textContent = 'Ouvrir le dossier ↗'; }
      else { cta.removeAttribute('href'); cta.setAttribute('aria-disabled', 'true'); cta.textContent = 'Bientôt'; }
      document.getElementById('compteur-n').textContent = String(i + 1).padStart(2, '0');
      bloc.classList.remove('est-change');
    }, premier ? 0 : 200);
  }
  function aller(i) {
    if (glisse()) { cible = Math.max(0, Math.min(N - 1, i)); majDefile(); return; }
    scrollTo({ top: Math.max(0, Math.min(N - 1, i)) * innerHeight, behavior: calme ? 'auto' : 'smooth' });
  }

  // Plein écran : dès qu'on fait défiler, la fiche remplace photo et nom.
  let defile = null;
  function majDefile() {
    const d = cible > .01;
    if (d === defile) return;
    const avant = defile;
    defile = d;
    document.documentElement.classList.toggle('defile', d);
    if (PLEIN && avant !== null && actif >= 0) { ++tour; if (d) { remplir(Math.round(cible)); entreeFiche(); } else sortieFiche(); }
    if (EMBED && parent !== window) parent.postMessage({ type: 'projets-defile', on: d }, '*');
  }
  addEventListener('scroll', majDefile, { passive: true });
  function tic() {
    courant += (cible - courant) * (calme ? 1 : .09);
    if (Math.abs(cible - courant) < .0005) courant = cible;
    poser();
    fiche(Math.round(courant));
    requestAnimationFrame(tic);
  }
  addEventListener('scroll', lire, { passive: true });
  addEventListener('resize', () => { lire(); poser(); });
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); aller(Math.round(cible) + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); aller(Math.round(cible) - 1); }
  });
  // Glisser horizontal (doigt ou souris) dans le mode intégré mobile.
  const majGlisse = () => document.documentElement.classList.toggle('glisse', glisse());
  majGlisse(); addEventListener('resize', majGlisse);
  let x0 = null, y0 = 0, aGlisse = false;
  scene.addEventListener('pointerdown', (e) => { x0 = e.clientX; y0 = e.clientY; aGlisse = false; });
  addEventListener('pointerup', (e) => {
    if (x0 === null || !glisse()) { x0 = null; return; }
    const dx = e.clientX - x0, dy = e.clientY - y0; x0 = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { aGlisse = true; aller(Math.round(cible) + (dx < 0 ? 1 : -1)); }
    else if (!telIntegre() && e.pointerType === 'touch' && Math.abs(dy) > 40) { aGlisse = true; aller(Math.round(cible) + (dy < 0 ? 1 : -1)); }
  });
  // Molette et trackpad : un cran par geste (l'inertie du trackpad est ignorée).
  let cumul = 0, dernierPas = 0, dernierEv = 0;
  addEventListener('wheel', (e) => {
    if (telIntegre()) return;                       // la page autour défile
    e.preventDefault();
    const t = performance.now();
    if (t - dernierEv > 220) cumul = 0;             // nouveau geste
    dernierEv = t;
    cumul += Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    if (Math.abs(cumul) > 24 && t - dernierPas > 650) {
      aller(Math.round(cible) + (cumul > 0 ? 1 : -1));
      dernierPas = t; cumul = 0;
    }
  }, { passive: false });
  // Un glisser n’est pas un clic.
  scene.addEventListener('click', (e) => { if (aGlisse) { e.preventDefault(); e.stopPropagation(); aGlisse = false; } }, true);
  lire(); courant = cible; poser(); fiche(Math.round(cible));
  // Intégré : la liste pour le menu Index de l'accueil, et ses ordres.
  if (EMBED && parent !== window) {
    const envoyerListe = () => parent.postMessage({ type: 'projets-liste', actif, liste: PROJETS.map((p) => ({ nom: p.nom, annee: p.annee, id: p.id || null })) }, '*');
    envoyerListe();
    addEventListener('message', (e) => {
      if (e.source !== parent) return;
      const d = e.data || {};
      if (d.type === 'projets-demande') { envoyerListe(); defile = null; majDefile(); }
      if (d.type === 'projets-aller' && Number.isInteger(d.i)) aller(d.i);
    });
  }
  requestAnimationFrame(tic);
})();
</script>
</body>
</html>
