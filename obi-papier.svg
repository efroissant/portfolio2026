<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- Papier de l'obi, en tuile raccordée (stitchTiles), à poser en
       « multiply » sur le blanc de l'obi :
       1. le relief : petites bosses éclairées en lumière rasante ;
       2. la pâte : nuages irréguliers, plus ou moins épais ;
       3. le grain fin : la dent du papier. -->
  <filter id="papier" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="4" seed="11" stitchTiles="stitch" result="bosses"/>
    <feDiffuseLighting in="bosses" surfaceScale="0.9" diffuseConstant="1.08" lighting-color="#ffffff" result="relief">
      <feDistantLight azimuth="125" elevation="68"/>
    </feDiffuseLighting>

    <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="5" stitchTiles="stitch" result="nuage"/>
    <feColorMatrix in="nuage" type="matrix"
      values="0 0 0 0 0.80
              0 0 0 0 0.77
              0 0 0 0 0.70
              0 0 0 -0.9 0.52" result="pate"/>

    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="2" stitchTiles="stitch" result="dent"/>
    <feColorMatrix in="dent" type="matrix"
      values="0 0 0 0 0.55
              0 0 0 0 0.52
              0 0 0 0 0.47
              0 0 0 -1.6 0.86" result="grain"/>

    <feComposite in="pate" in2="relief" operator="over" result="r1"/>
    <feComposite in="grain" in2="r1" operator="over" result="papier"/>
    <!-- Une pointe de chaleur : papier légèrement crème. -->
    <feColorMatrix in="papier" type="matrix"
      values="1 0 0 0 0
              0 0.993 0 0 0
              0 0 0.97 0 0
              0 0 0 1 0"/>
  </filter>
  <rect width="600" height="600" filter="url(#papier)"/>
</svg>
